<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Soft Ambient Glow Orbs with Native SMIL Pulsing (Background Layer) -->
  <circle cx="160" cy="90" r="140" fill="url(#glowCyan)">
    <animate attributeName="r" values="130;160;130" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1060" cy="270" r="160" fill="url(#glowIndigo)">
    <animate attributeName="r" values="150;180;150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="960" cy="80" r="110" fill="url(#glowPurple)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Dynamic / Animated Flow Paths (Simulating Agile Sprint Velocity & Burndown) -->
  <path d="M 40 310 C 280 250, 480 340, 780 280 S 1080 250, 1180 290" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-180" dur="14s" repeatCount="indefinite"/>
  </path>
  <path d="M 20 280 C 260 210, 580 310, 880 230 S 1060 210, 1180 240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" values="0;-140" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Dynamic Floating Decorative Kanban Card 1 (Top Right, In Background) -->
  <g transform="translate(930, 45)">
    <animateTransform attributeName="transform" type="translate" values="930,45; 930,34; 930,45" dur="6s" repeatCount="indefinite"/>
    <rect width="210" height="110" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="20" y="20" width="60" height="8" rx="4" fill="#38bdf8" opacity="0.9"/>
    <rect x="20" y="42" width="150" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="20" y="58" width="110" height="6" rx="3" fill="#64748b" opacity="0.4"/>
    <rect x="20" y="78" width="45" height="16" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="180" cy="86" r="10" fill="#818cf8" opacity="0.85"/>
  </g>

  <!-- Dynamic Floating Decorative Kanban Card 2 (Bottom Right, In Background) -->
  <g transform="translate(860, 175)">
    <animateTransform attributeName="transform" type="translate" values="860,175; 860,186; 860,175" dur="8s" repeatCount="indefinite"/>
    <rect width="230" height="120" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.45"/>
    <rect x="20" y="20" width="75" height="8" rx="4" fill="#10b981" opacity="0.9"/>
    <rect x="20" y="42" width="170" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="20" y="58" width="130" height="6" rx="3" fill="#64748b" opacity="0.4"/>
    <rect x="20" y="82" width="55" height="18" rx="9" fill="#1e293b" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="195" cy="91" r="11" fill="#38bdf8" opacity="0.85"/>
  </g>

  <!-- Outer Sleek Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- ================= FOREGROUND ELEMENTS (STRICTLY ON TOP) ================= -->

  <!-- Top Category Chip -->
  <g transform="translate(80, 48)">
    <rect width="195" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 130)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primaryGrad)">Agile Project Management</tspan>
    </text>
  </g>

  <!-- Subtitle Lines -->
  <g transform="translate(80, 175)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated guide to Scrum, Kanban, Sprints &amp; Issue Tracking: Top Enterprise SaaS &amp; Open-Source Tools.
    </text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">
      Data-backed comparisons, starting tier pricing, free plan limits, and GitHub stargazer metrics.
    </text>
  </g>

  <!-- Feature / Topic Pills -->
  <g transform="translate(80, 248)">
    <!-- Pill 1: Scrum & Sprints -->
    <g transform="translate(0, 0)">
      <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="22" cy="19" r="4" fill="#38bdf8"/>
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Scrum &amp; Sprints</text>
    </g>

    <!-- Pill 2: Kanban Boards -->
    <g transform="translate(186, 0)">
      <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="22" cy="19" r="4" fill="#818cf8"/>
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Kanban Boards</text>
    </g>

    <!-- Pill 3: Enterprise SaaS -->
    <g transform="translate(367, 0)">
      <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="22" cy="19" r="4" fill="#c084fc"/>
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Enterprise SaaS</text>
    </g>

    <!-- Pill 4: Open-Source -->
    <g transform="translate(548, 0)">
      <rect width="190" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="22" cy="19" r="4" fill="#10b981"/>
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">100% Open-Source</text>
    </g>
  </g>
</svg>
